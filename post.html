<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yazı — Formda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <style>
    .article { max-width: 760px; margin-inline: auto; padding: clamp(24px,4vw,44px) 0; }
    .breadcrumb { display: flex; gap: 8px; align-items: center; color: var(--text-mute); font-size: .85rem; margin-bottom: 20px; flex-wrap: wrap; }
    .breadcrumb a { color: var(--brand); font-weight: 600; }
    .back-link { display: inline-flex; align-items: center; gap: 8px; color: var(--brand); font-weight: 600; margin-bottom: 12px; }
    .back-link svg { width: 18px; height: 18px; }
    .article h1 { font-size: clamp(1.9rem, 4.6vw, 2.9rem); margin: 8px 0 18px; }
    .article-meta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; color: var(--text-mute); font-size: .9rem; margin-bottom: 26px; }
    .article-meta .who { color: var(--text-soft); font-weight: 600; }
    .article-meta img.av { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; }
    .article-meta .sep { width: 3px; height: 3px; border-radius: 50%; background: var(--text-mute); }
    .article-hero { position: relative; border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--glow); margin-bottom: 32px; aspect-ratio: 16/9; border: 1px solid var(--border); }
    .article-hero img { width: 100%; height: 100%; object-fit: cover; }
    .prose { font-size: 1.08rem; color: var(--text-soft); font-weight: 300; line-height: 1.75; }
    .prose h2 { font-size: 1.5rem; color: var(--text); margin: 34px 0 12px; }
    .prose p { margin-bottom: 18px; }
    .prose strong { color: var(--text); }
    .prose ul.dots { display: grid; gap: 10px; margin: 0 0 20px; }
    .prose ul.dots li { position: relative; padding-left: 28px; }
    .prose ul.dots li::before { content: ""; position: absolute; left: 4px; top: 9px; width: 8px; height: 8px; border-radius: 50%; background: var(--brand); box-shadow: 0 0 10px var(--brand); }
    blockquote { margin: 26px 0; padding: 18px 24px; border-left: 3px solid var(--brand); background: var(--brand-soft); border-radius: 12px; color: var(--text); font-weight: 500; }
    .product-cta { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; padding: 22px; margin: 36px 0; border: 1px solid var(--border); border-radius: var(--radius-lg); background: radial-gradient(70% 120% at 100% 0%, var(--brand-soft), transparent 60%), var(--card); box-shadow: var(--shadow-md); }
    .product-cta img.pimg { width: 92px; height: 92px; border-radius: var(--radius); object-fit: cover; border: 1px solid var(--border); }
    .product-cta .pc-info { flex: 1 1 220px; }
    .product-cta .pc-info .k { font-size: .74rem; color: var(--brand); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
    .product-cta .pc-info h4 { font-size: 1.2rem; margin: 4px 0 8px; }
    .price { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .price .now { font-family: var(--font-head); font-weight: 700; font-size: 1.3rem; color: var(--text); }
    .price .now::after { content: " ₺"; font-size: .8em; color: var(--text-soft); }
    .price .old { font-size: .9rem; color: var(--text-mute); text-decoration: line-through; }
    .discount-badge { padding: 4px 10px; border-radius: var(--radius-pill); background: var(--brand-soft); color: var(--brand); font-size: .76rem; font-weight: 700; }
    .tags { display: flex; gap: 8px; flex-wrap: wrap; margin: 28px 0; }
    .tags a { padding: 6px 14px; border-radius: var(--radius-pill); background: var(--card); border: 1px solid var(--border); font-size: .85rem; color: var(--text-soft); }
    .tags a:hover { border-color: var(--brand); color: var(--brand); }
    /* Zengin içerik öğeleri */
    .lede { font-size: 1.22rem; line-height: 1.6; color: var(--text); font-weight: 300; margin-bottom: 26px; }
    .takeaways { border: 1px solid var(--border); border-radius: var(--radius-lg); background: radial-gradient(80% 120% at 0% 0%, var(--brand-soft), transparent 55%), var(--card); padding: 22px 24px; margin: 8px 0 30px; }
    .takeaways h3 { display: flex; align-items: center; gap: 9px; font-size: .8rem; letter-spacing: .1em; text-transform: uppercase; color: var(--brand); margin-bottom: 14px; font-family: var(--font-body); font-weight: 700; }
    .takeaways h3 svg { width: 17px; height: 17px; }
    .takeaways ul { display: grid; gap: 12px; }
    .takeaways li { position: relative; padding-left: 30px; color: var(--text-soft); font-weight: 300; }
    .takeaways li svg { position: absolute; left: 0; top: 3px; width: 19px; height: 19px; color: var(--brand); }
    .progress-bar { position: fixed; top: 0; left: 0; height: 3px; width: 0; z-index: 200; background: linear-gradient(90deg, var(--brand), var(--accent)); transition: width .1s linear; }
    .author-box { display: flex; gap: 16px; align-items: center; padding: 20px 22px; margin: 34px 0; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--card); }
    .author-box img { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; flex: 0 0 auto; }
    .author-box .ab-name { font-family: var(--font-head); font-weight: 600; font-size: 1.05rem; }
    .author-box .ab-role { font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--brand); margin-bottom: 6px; }
    .author-box .ab-bio { font-size: .9rem; color: var(--text-soft); font-weight: 300; }
    .share { display: flex; align-items: center; gap: 10px; margin: 26px 0 4px; flex-wrap: wrap; }
    .share span { font-size: .85rem; color: var(--text-mute); }
    .share a { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; background: var(--card); border: 1px solid var(--border); color: var(--text-soft); transition: all .2s; }
    .share a:hover { border-color: var(--brand); color: var(--brand); transform: translateY(-2px); }
    .share svg { width: 17px; height: 17px; }
    /* İçindekiler */
    .toc { border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--card); padding: 20px 22px; margin: 0 0 30px; }
    .toc h3 { display: flex; align-items: center; gap: 9px; font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; color: var(--text-mute); margin-bottom: 12px; font-family: var(--font-body); font-weight: 700; }
    .toc h3 svg { width: 16px; height: 16px; }
    .toc ol { counter-reset: toc; display: grid; gap: 8px; }
    .toc li { counter-increment: toc; }
    .toc a { display: flex; gap: 10px; color: var(--text-soft); font-weight: 300; transition: color .2s; }
    .toc a::before { content: counter(toc, decimal-leading-zero); color: var(--brand); font-family: var(--font-head); font-weight: 600; font-size: .85rem; }
    .toc a:hover { color: var(--brand); }
    /* İpucu kutusu */
    .callout { display: flex; gap: 14px; padding: 16px 18px; margin: 22px 0; border-radius: var(--radius); background: var(--brand-soft); border: 1px solid color-mix(in srgb, var(--brand) 30%, var(--border)); }
    .callout svg { width: 22px; height: 22px; color: var(--brand); flex: 0 0 auto; margin-top: 2px; }
    .callout p { margin: 0; color: var(--text); font-weight: 300; }
    .callout b { font-weight: 600; }
    /* Yazı içi SSS başlığı */
    .post-faq-title { font-family: var(--font-head); font-weight: 500; font-size: 1.5rem; margin: 38px 0 16px; }
    .prose h2 { scroll-margin-top: 90px; }
  </style>
</head>
<body>

  <div class="progress-bar" id="progress"></div>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <span class="logo-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h7l-1 8 10-12h-7z"/></svg></span>
        <span>Form<b>da</b></span>
      </a>
      <nav class="nav" aria-label="Ana menü">
        <a href="index.html">Anasayfa</a>
        <a href="index.html#blog">Yazılar</a>
        <a href="index.html#sss">SSS</a>
        <a href="index.html#bulten">İletişim</a>
      </nav>
      <div class="header-actions">
        <button class="icon-btn" data-theme-toggle aria-label="Tema değiştir"></button>
        <a href="index.html#magaza" class="btn btn-primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
          Mağaza
        </a>
        <button class="icon-btn menu-toggle" id="menuToggle" aria-label="Menüyü aç" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="7" x2="21" y2="7"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="17" x2="21" y2="17"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="mobile-nav" id="mobileNav">
    <a href="index.html">Anasayfa</a>
    <a href="index.html#blog">Yazılar</a>
    <a href="index.html#sss">SSS</a>
    <a href="index.html#bulten">İletişim</a>
  </div>

  <main>
    <div class="container">
      <article class="article" id="article"><!-- JS --></article>
    </div>

    <section class="section" style="padding-top:clamp(20px,4vw,40px)">
      <div class="container">
        <div class="section-head">
          <div class="st"><span class="kicker">Devam et</span><h2>İlgini çekebilir</h2></div>
        </div>
        <div class="posts-grid" id="related"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom" style="border:0;justify-content:center;">
        <span>© <span id="year">2025</span> Formda Blog · Demo amaçlı tasarlanmıştır.</span>
      </div>
    </div>
  </footer>

  <button class="to-top" id="toTop" aria-label="Yukarı çık">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
  </button>

  <script src="js/data.js"></script>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var id = Number(params.get("id")) || 1;
      var P = window.SITE_DATA.POSTS;
      var C = window.SITE_DATA.CATEGORIES;
      var CONTENT = window.SITE_DATA.POST_CONTENT || {};
      var AUTHORS = window.SITE_DATA.AUTHORS || {};
      var hueOf = function (cid) { var c = C.find(function (x) { return x.id === cid; }); return c ? c.hue : 210; };
      var post = P.find(function (p) { return p.id === id; }) || P[0];
      document.title = post.title + " — Formda";

      var rich = CONTENT[post.id] || {};
      var intro = rich.intro || post.excerpt;
      var checkSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';

      var takeaways = (rich.takeaways && rich.takeaways.length)
        ? '<div class="takeaways"><h3>' + checkSvg.replace('stroke-width="2.4"', 'stroke-width="2"') + ' Öne çıkanlar</h3><ul>' +
            rich.takeaways.map(function (t) { return '<li>' + checkSvg + t + '</li>'; }).join("") + '</ul></div>'
        : "";

      var callout = '<div class="callout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1h6c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z"/></svg><p><b>İpucu:</b> Yeni bir takviyeye başlarken tek seferde tek ürün dene; böylece etkisini ve olası yan etkilerini net biçimde gözlemleyebilirsin.</p></div>';
      var body = '<p class="lede">' + intro + '</p>' + takeaways + callout +
        (rich.body ? rich.body.join("") :
          "<p>Bu yazıda " + post.title.toLowerCase() + " konusunu güncel bilimsel bulgular ışığında ele alıyoruz.</p>");

      var discount = post.oldPrice ? Math.round((1 - Number(post.price) / Number(post.oldPrice)) * 100) : 0;
      var authorBio = AUTHORS[post.author] || "";

      document.getElementById("article").innerHTML =
        '<a class="back-link" href="index.html#blog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg> Tüm yazılar</a>' +
        '<div class="breadcrumb"><a href="index.html">Formda</a> › <span>' + post.categoryLabel + "</span></div>" +
        "<h1>" + post.title + "</h1>" +
        '<div class="article-meta"><img class="av" src="' + post.authorAvatar + '" alt="' + post.author + '"><span class="who">' + post.author + '</span><span class="sep"></span><span>' + post.date + "</span><span class=\"sep\"></span><span>" + post.readTime + " dk okuma</span></div>" +
        '<div class="article-hero"><img src="' + post.image + '" alt="' + post.title + '"></div>' +
        '<div class="prose">' + body +
          '<div class="product-cta">' +
            '<img class="pimg" src="' + post.image + '" alt="' + post.title + '">' +
            '<div class="pc-info"><span class="k">Önerilen ürün</span><h4>' + post.title.split(":")[0] + '</h4>' +
              '<div class="price"><span class="now">' + post.price + '</span>' + (post.oldPrice ? '<span class="old">' + post.oldPrice + ' ₺</span>' : "") + (discount ? ' <span class="discount-badge">%' + discount + " indirim</span>" : "") + "</div></div>" +
            '<a class="shop-btn" href="' + post.shopUrl + '" data-shop="' + post.title + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg> Mağazada İncele</a>' +
          "</div>" +
        "</div>" +
        '<div class="tags">' + post.tags.map(function (t) { return '<a href="index.html#blog">#' + t + "</a>"; }).join("") + "</div>" +
        '<div class="share"><span>Paylaş:</span>' +
          '<a href="#" aria-label="X"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.9 2H22l-7.3 8.3L23 22h-6.6l-5.2-6.8L5.3 22H2l7.8-8.9L1.5 2h6.8l4.7 6.2L18.9 2zm-1.2 18h1.7L7.1 3.8H5.3L17.7 20z"/></svg></a>' +
          '<a href="#" aria-label="Facebook"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.5h-1.2c-1.2 0-1.6.75-1.6 1.5V12h2.7l-.4 2.9h-2.3v7A10 10 0 0 0 22 12z"/></svg></a>' +
          '<a href="#" aria-label="WhatsApp"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.5 15.2L2 22l4.9-1.4A10 10 0 1 0 12 2zm0 18a8 8 0 0 1-4.1-1.1l-.3-.2-2.9.8.8-2.8-.2-.3A8 8 0 1 1 12 20zm4.4-6c-.2-.1-1.4-.7-1.6-.8-.2-.1-.4-.1-.5.1l-.7.9c-.1.2-.3.2-.5.1a6.5 6.5 0 0 1-3.2-2.8c-.1-.2 0-.4.1-.5l.4-.5.2-.4v-.4L9.6 7.5c-.1-.3-.3-.3-.4-.3H8.7c-.2 0-.4.1-.6.3-.7.7-.9 1.6-.6 2.6.6 1.9 1.9 3.5 3.7 4.5 2.3 1.3 3.2 1.1 4.2.9.6-.1 1.4-.6 1.6-1.2.2-.6.2-1 .1-1.1l-.3-.2z"/></svg></a>' +
        "</div>" +
        (authorBio ? '<div class="author-box"><img src="' + post.authorAvatar + '" alt="' + post.author + '"><div><div class="ab-role">Yazar</div><div class="ab-name">' + post.author + '</div><div class="ab-bio">' + authorBio + "</div></div></div>" : "");

      // İçindekiler (TOC) — bölüm başlıklarından otomatik üret
      var prose = document.querySelector(".prose");
      var heads = prose ? prose.querySelectorAll("h2") : [];
      if (heads.length > 1) {
        var toc = '<div class="toc"><h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg> İçindekiler</h3><ol>';
        heads.forEach(function (h, i) {
          var slug = "bolum-" + (i + 1);
          h.id = slug;
          toc += '<li><a href="#' + slug + '">' + h.textContent + "</a></li>";
        });
        toc += "</ol></div>";
        var firstH2 = heads[0];
        firstH2.insertAdjacentHTML("beforebegin", toc);
      }

      // Yazı içi mini SSS
      var pFaq = (window.SITE_DATA.POST_FAQ || {})[post.id];
      if (pFaq && pFaq.length) {
        var plus = '<span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></span>';
        var faqHTML = '<h2 class="post-faq-title">Bu konuda sık sorulanlar</h2><div class="faq" id="postFaq">' +
          pFaq.map(function (f) { return '<div class="faq-item"><button class="faq-q">' + f.q + plus + '</button><div class="faq-a"><p>' + f.a + "</p></div></div>"; }).join("") + "</div>";
        document.getElementById("article").insertAdjacentHTML("beforeend", faqHTML);
        var pf = document.getElementById("postFaq");
        pf.addEventListener("click", function (e) {
          var q = e.target.closest(".faq-q");
          if (!q) return;
          var item = q.parentElement, ans = item.querySelector(".faq-a"), open = item.classList.contains("open");
          pf.querySelectorAll(".faq-item.open").forEach(function (el) { el.classList.remove("open"); el.querySelector(".faq-a").style.maxHeight = null; });
          if (!open) { item.classList.add("open"); ans.style.maxHeight = ans.scrollHeight + "px"; }
        });
      }

      // Okuma ilerleme çubuğu
      var bar = document.getElementById("progress");
      var art = document.getElementById("article");
      function updateProgress() {
        var top = art.offsetTop;
        var h = art.offsetHeight - window.innerHeight;
        var p = h > 0 ? Math.min(1, Math.max(0, (window.scrollY - top) / h)) : 0;
        bar.style.width = (p * 100) + "%";
      }
      window.addEventListener("scroll", updateProgress, { passive: true });
      updateProgress();

      var related = P.filter(function (p) { return p.category === post.category && p.id !== post.id; }).slice(0, 3);
      if (related.length < 3) related = related.concat(P.filter(function (p) { return p.id !== post.id && related.indexOf(p) === -1; })).slice(0, 3);

      document.getElementById("related").innerHTML = related.map(function (p) {
        return '<article class="card reveal in" style="--hue:' + hueOf(p.category) + '">' +
          '<a class="card-media" href="post.html?id=' + p.id + '"><span class="card-cat">' + p.categoryLabel + '</span><img src="' + p.image + '" alt="' + p.title + '" loading="lazy"></a>' +
          '<div class="card-body"><h3><a href="post.html?id=' + p.id + '">' + p.title + '</a></h3>' +
          '<p class="excerpt">' + p.excerpt + '</p>' +
          '<div class="byline"><img src="' + p.authorAvatar + '" alt="' + p.author + '"><span class="who">' + p.author + '</span></div>' +
          '<div class="card-foot"><span class="rt">' + p.readTime + ' dk</span><a class="shop-btn" href="' + p.shopUrl + '" data-shop="' + p.title + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg> Ürüne Git</a></div></div>' +
          '</article>';
      }).join("");
    })();
  </script>
  <script src="js/main.js"></script>
</body>
</html>
