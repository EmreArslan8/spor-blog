<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yazı — Ferah</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
  <style>
    /* Sadece detay sayfasına özel yerleşim */
    .article { max-width: 760px; margin-inline: auto; padding: clamp(24px,4vw,48px) 0; }
    .breadcrumb { display: flex; gap: 8px; align-items: center; color: var(--text-mute); font-size: .85rem; margin-bottom: 22px; flex-wrap: wrap; }
    .breadcrumb a { color: var(--brand-strong); font-weight: 600; }
    .article h1 { font-size: clamp(1.8rem, 4.4vw, 2.8rem); margin: 10px 0 18px; }
    .article-meta { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; color: var(--text-mute); font-size: .9rem; margin-bottom: 26px; }
    .article-meta .card-author img { width: 40px; height: 40px; }
    .article-hero { border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-md); margin-bottom: 32px; aspect-ratio: 16/9; }
    .article-hero img { width: 100%; height: 100%; object-fit: cover; }
    .prose { font-size: 1.06rem; color: var(--text-soft); }
    .prose h2 { font-size: 1.5rem; color: var(--text); margin: 34px 0 12px; }
    .prose p { margin-bottom: 18px; }
    .prose ul.dots { list-style: none; display: grid; gap: 10px; margin: 0 0 20px; }
    .prose ul.dots li { position: relative; padding-left: 28px; }
    .prose ul.dots li::before { content: ""; position: absolute; left: 4px; top: 9px; width: 8px; height: 8px; border-radius: 50%; background: var(--brand); }
    blockquote { margin: 26px 0; padding: 18px 24px; border-left: 4px solid var(--brand); background: var(--brand-soft); border-radius: 12px; color: var(--text); font-weight: 500; }
    /* Ürün / e-ticaret yönlendirme kutusu */
    .product-cta { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; padding: 22px; margin: 36px 0; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-sm); }
    .product-cta img { width: 96px; height: 96px; border-radius: var(--radius); object-fit: cover; }
    .product-cta .pc-info { flex: 1 1 220px; }
    .product-cta .pc-info .k { font-size: .8rem; color: var(--brand-strong); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
    .product-cta .pc-info h4 { font-size: 1.2rem; margin: 4px 0 6px; }
    .tags { display: flex; gap: 8px; flex-wrap: wrap; margin: 28px 0; }
    .tags a { padding: 6px 14px; border-radius: var(--radius-pill); background: var(--surface-2); font-size: .85rem; color: var(--text-soft); }
    .related { margin-top: 20px; }
    .back-link { display: inline-flex; align-items: center; gap: 8px; color: var(--brand-strong); font-weight: 600; margin-bottom: 8px; }
    .back-link svg { width: 18px; height: 18px; }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <span class="logo-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h7l-1 8 10-12h-7z"/></svg></span>
        <span>Fe<b>rah</b></span>
      </a>
      <nav class="nav" aria-label="Ana menü">
        <a href="index.html">Anasayfa</a>
        <a href="index.html#blog">Yazılar</a>
        <a href="index.html#kategoriler">Kategoriler</a>
        <a href="index.html#bulten">Bülten</a>
      </nav>
      <div class="header-actions">
        <button class="icon-btn" data-theme-toggle aria-label="Tema değiştir"></button>
        <a href="index.html#blog" class="btn btn-primary">Keşfet</a>
        <button class="icon-btn menu-toggle" id="menuToggle" aria-label="Menüyü aç" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="7" x2="21" y2="7"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="17" x2="21" y2="17"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="mobile-nav" id="mobileNav">
    <a href="index.html">Anasayfa</a>
    <a href="index.html#blog">Yazılar</a>
    <a href="index.html#kategoriler">Kategoriler</a>
    <a href="index.html#bulten">Bülten</a>
  </div>

  <main>
    <div class="container">
      <article class="article" id="article">
        <!-- JS ile doldurulur -->
      </article>
    </div>

    <!-- İlgili yazılar -->
    <section class="section related">
      <div class="container">
        <div class="section-head">
          <div class="st"><p class="section-tag">Devam et</p><h2>İlgini çekebilir</h2></div>
        </div>
        <div class="posts-grid" id="posts"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom" style="border:0;justify-content:center;">
        <span>© <span id="year">2025</span> Ferah Blog · Demo amaçlı tasarlanmıştır.</span>
      </div>
    </div>
  </footer>

  <button class="to-top" id="toTop" aria-label="Yukarı çık">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
  </button>

  <script src="js/data.js"></script>
  <script>
    // Detay sayfası içeriğini oluştur (mock gövde metni)
    (function () {
      var params = new URLSearchParams(location.search);
      var id = Number(params.get("id")) || 1;
      var P = window.FERAH_DATA.POSTS;
      var post = P.find(function (p) { return p.id === id; }) || P[0];

      document.title = post.title + " — Ferah";

      var body = [
        "<p>Spor takviyeleri dünyası pazarlama vaatleriyle dolu. Bu yazıda <strong>" + post.title.toLowerCase() + "</strong> konusunu abartıya kaçmadan, güncel bilimsel bulgular ışığında ele alıyoruz. Amacımız; ne işe yaradığını, kimin için uygun olduğunu ve nelere dikkat etmen gerektiğini net biçimde aktarmak.</p>",
        "<h2>Neden önemli?</h2>",
        "<p>Doğru takviye, doğru zamanda ve doğru dozda alındığında antrenman verimini ve toparlanmayı destekleyebilir. Ancak her ürün herkes için uygun değildir. Beslenme düzenin, hedefin ve mevcut sağlık durumun belirleyici faktörlerdir.</p>",
        "<ul class='dots'><li>Etken maddeyi ve dozunu mutlaka kontrol et.</li><li>Bağımsız laboratuvar testinden geçmiş markaları tercih et.</li><li>Takviyeyi dengeli beslenmenin yerine değil, yanında düşün.</li></ul>",
        "<blockquote>Takviye bir kısayol değil, iyi kurgulanmış bir beslenme ve antrenman planının tamamlayıcısıdır.</blockquote>",
        "<h2>Kimler kullanmalı?</h2>",
        "<p>Düzenli antrenman yapan, beslenmesinden belirli besinleri yeterince alamayan ya da belirli bir performans hedefi olan kişiler bu takviyeden fayda görebilir. Yine de bir uzmana danışmak her zaman en sağlıklısıdır.</p>",
        "<p>Aşağıdaki ürün, bu yazıda anlatılan kriterleri karşılayan örnek bir seçenektir. İncelemek için mağaza sayfasına göz atabilirsin.</p>"
      ].join("");

      var discount = post.oldPrice ? Math.round((1 - Number(post.price) / Number(post.oldPrice)) * 100) : 0;

      document.getElementById("article").innerHTML =
        '<a class="back-link" href="index.html#blog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg> Tüm yazılar</a>' +
        '<div class="breadcrumb"><a href="index.html">Ferah</a> › <span>' + post.categoryLabel + "</span></div>" +
        "<h1>" + post.title + "</h1>" +
        '<div class="article-meta"><div class="card-author"><img src="' + post.authorAvatar + '" alt="' + post.author + '"><span class="an">' + post.author + "</span></div><span class=\"sep\" style=\"width:3px;height:3px;border-radius:50%;background:var(--text-mute)\"></span><span>" + post.date + "</span><span>· " + post.readTime + " dk okuma</span></div>" +
        '<div class="article-hero"><img src="' + post.image + '" alt="' + post.title + '"></div>' +
        '<div class="prose">' + body +
          '<div class="product-cta">' +
            '<img src="' + post.image + '" alt="' + post.title + '">' +
            '<div class="pc-info"><span class="k">Önerilen ürün</span><h4>' + post.title.split(":")[0] + '</h4>' +
              '<div class="price"><span class="now">' + post.price + '</span>' + (post.oldPrice ? '<span class="old">' + post.oldPrice + ' ₺</span>' : "") + (discount ? ' <span class="discount-badge" style="position:static">%' + discount + " indirim</span>" : "") + "</div></div>" +
            '<a class="shop-btn btn-lg" href="' + post.shopUrl + '" data-shop="' + post.title + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg> Mağazada İncele</a>' +
          "</div>" +
        "</div>" +
        '<div class="tags">' + post.tags.map(function (t) { return '<a href="index.html#blog">#' + t + "</a>"; }).join("") + "</div>";

      // İlgili yazılar (aynı kategori, kendisi hariç, ilk 3)
      var related = P.filter(function (p) { return p.category === post.category && p.id !== post.id; }).slice(0, 3);
      if (related.length < 3) related = related.concat(P.filter(function (p) { return p.id !== post.id && related.indexOf(p) === -1; })).slice(0, 3);

      document.getElementById("posts").innerHTML = related.map(function (p) {
        var d = p.oldPrice ? Math.round((1 - Number(p.price) / Number(p.oldPrice)) * 100) : 0;
        return '<article class="card reveal in"><a class="card-media" href="post.html?id=' + p.id + '"><img src="' + p.image + '" alt="' + p.title + '" loading="lazy"><span class="card-cat">' + p.categoryLabel + "</span>" + (d ? '<span class="discount-badge">%' + d + " indirim</span>" : "") + '</a><div class="card-body"><div class="card-meta"><span>' + p.date + '</span></div><h3><a href="post.html?id=' + p.id + '">' + p.title + '</a></h3><p class="excerpt">' + p.excerpt + '</p><div class="card-foot"><div class="price"><span class="now">' + p.price + "</span></div><a class=\"shop-btn\" href=\"" + p.shopUrl + "\" data-shop=\"" + p.title + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg> Ürüne Git</a></div></div></article>';
      }).join("");
    })();
  </script>
  <script src="js/main.js"></script>
</body>
</html>
